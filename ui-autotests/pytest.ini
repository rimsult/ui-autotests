[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --alluredir=allure-results
markers =
    calendar: Календарь
    modals: Модальные окна
    ads: Реклама
    message: Поле Message
    positive: Позитивные сценарии
    negative: Негативные сценарии
log_cli = true
log_cli_level = INFO
